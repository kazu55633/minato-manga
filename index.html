<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミナト式漫画生成機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 黒い画面の真ん中に、ロゴとパスワード欄だけ */
:root{--bg:#15161c;--ink:#f3f4f8;--sub:#a6a9b7;--field:#22242c;--line:#3a3d48;--accent:#2446d8;--pop:#ffd23f;--err:#ff8a8a;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;--body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  background-image:repeating-conic-gradient(from 0deg at 50% 38%,transparent 0deg 6deg,rgba(255,255,255,.035) 6deg 8deg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;padding-block:24px}
.logo{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1.4fr;gap:3px;width:44px;height:50px;transform:rotate(-6deg);margin:0 auto 6px}
.logo i{border:3px solid var(--ink)}
.logo i:nth-child(3){grid-column:span 2;background:var(--pop);border-color:var(--pop)}
h1{font-family:var(--display);font-weight:400;font-size:26px;text-align:center;margin:0;letter-spacing:.02em}
p{margin:0;text-align:center;color:var(--sub);font-size:13px}
label{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:6px;margin-top:8px}
input[type=password],input[type=text]{font:inherit;font-size:17px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.row{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:13px;font-weight:400;color:var(--sub);margin-top:0}
.row input{width:18px;height:18px;accent-color:var(--accent)}
button{font-family:var(--display);font-size:18px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;cursor:pointer;box-shadow:0 4px 0 var(--pop)}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--err);font-weight:700;min-height:1.3em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
  <h1>ミナト式漫画生成機</h1>
  <p>パスワードを入れると使えます</p>
  <label>パスワード<input type="password" id="pw" autocomplete="current-password" required></label>
  <label class="row"><input type="checkbox" id="keep">この端末では次から入力しない</label>
  <button id="go">開く</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c)));
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();const pw=document.getElementById("pw").value;
  go.disabled=true;go.textContent="開いています…";err.textContent="";
  try{
    if(document.getElementById("keep").checked){try{localStorage.setItem("minato-manga-pw",pw)}catch(_){}}
    await open(pw);
  }catch(_){
    try{localStorage.removeItem("minato-manga-pw")}catch(__){}
    err.textContent="パスワードがちがいます";go.disabled=false;go.textContent="開く";
  }
});
if(!window.crypto||!crypto.subtle){err.textContent="このブラウザでは開けません。https:// のページで開いてください";go.disabled=true}
else{let saved=null;try{saved=localStorage.getItem("minato-manga-pw")}catch(_){}
  if(saved){go.disabled=true;go.textContent="開いています…";open(saved).catch(()=>{try{localStorage.removeItem("minato-manga-pw")}catch(_){}go.disabled=false;go.textContent="開く"})}}
</script>
